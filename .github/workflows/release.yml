# Builds the mod and variants-reverter on Windows (MSVC) and packages the release zip.
# Push a tag v<version> (matching mods/forged-and-found/mod.json) to publish a GitHub
# release; run it manually (Actions tab) to get the zip as a build artifact only.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and package
        shell: pwsh
        run: ./tools/package.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: forged-and-found
          path: dist/*.zip

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = (Get-ChildItem dist/*.zip).FullName
          gh release create "${{ github.ref_name }}" $zip --title "Forged & Found ${{ github.ref_name }}" --generate-notes --prerelease
